<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        {% if confirmation %}
        <p style="color: green;">{{ confirmation }}</p>
        {% endif %}
        <h1>We'd love your feedback!</h1>
        <form action="/feedback" method="post">
            <input type="text" name="name" class="suggestion-input" placeholder="Your Name" required>
            <input type="email" name="email" class="suggestion-input" placeholder="Your Email" required>
            <textarea name="feedback" class="suggestion-input" placeholder="Your Feedback" rows="5" required></textarea>
            <button type="submit" class="button">Submit</button>
        </form>
        <a href="/" class="button">Back to App</a>
    </div>
</body>
</html>
